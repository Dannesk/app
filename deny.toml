# cargo-deny: what a change may bring into the app's dependency graph.
#
# .github/workflows/ci.yml runs `cargo deny check sources bans licenses` on
# every pull request and every push to main, and any finding fails the run.
# Advisories are checked in a step of their own that reports and never fails.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# The app ships for these two targets. Crates used only on Windows or macOS
# stay outside the graph until those builds exist.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# RustSec. Unmaintained and unsound crates are reported anywhere in the graph,
# not only among our direct dependencies. An advisory can land on a crate long
# after it entered the lock, so CI reports these without failing (ci.yml).
# The known one below is listed so that a warning on a pull request always
# means something new; every run still names it in its log.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # ttf-parser parses fonts for winit's Wayland title bar (sctk-adwaita, via
    # ab_glyph). Only those crates can replace it; RustSec suggests skrifa as
    # an alternative. fontdb, in iced's text stack, inlines a subset of
    # ttf-parser 0.25.1, which no advisory check can see.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; the crate reaches us only through winit's Wayland title bar" },
]

[licenses]
# Each licence here can be combined with GPL-3.0-or-later. A crate under any
# other licence fails the check until that licence is added here on purpose.
allow = [
    "GPL-3.0-or-later",  # the app itself
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Two versions of one crate are the upstream crates' concern, not a finding.
multiple-versions = "allow"
deny = [
    # iced's debug tooling, pulled in only by iced's `debug`, `hot` and `tester`
    # features. The beacon client is a TCP client whose address comes from an
    # environment variable. packaging/build-deb.sh refuses the same four.
    { crate = "iced_beacon", reason = "iced's debug tooling never ships" },
    { crate = "iced_devtools", reason = "iced's debug tooling never ships" },
    { crate = "iced_tester", reason = "iced's debug tooling never ships" },
    { crate = "cargo-hot-protocol", reason = "iced's debug tooling never ships" },
    # Telemetry and crash reporting. Every Sentry and OpenTelemetry crate
    # depends on one of these two.
    { crate = "sentry-core", reason = "no telemetry or crash reporting in the wallet" },
    { crate = "opentelemetry", reason = "no telemetry or crash reporting in the wallet" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# A git dependency must name the exact commit it builds.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# iced is pinned to one commit of its master branch (Cargo.toml). The next
# three are iced's own pinned dependencies. The last four are our own crates,
# each in its own repository and pinned to a commit: the core, which never
# goes to crates.io, and the codecs and the Noise crate until they are on it.
allow-git = [
    "https://github.com/iced-rs/iced",
    "https://github.com/iced-rs/winit.git",
    "https://github.com/iced-rs/cryoglyph.git",
    "https://github.com/hecrj/cosmic-text.git",
    "https://github.com/Dannesk/dannesk-core",
    "https://github.com/Dannesk/dannesk-xrpl-codec",
    "https://github.com/Dannesk/dannesk-btc-codec",
    "https://github.com/Dannesk/dannesk-noise-protocol",
]
