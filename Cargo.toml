[package]
name = "Dannesk"
version = "0.1.4"
edition = "2024"
license = "GPL-3.0-or-later"
description = "DeFi Wallet for XRPL and Bitcoin."


[dependencies]

dannesk-core = { git = "https://github.com/Dannesk/dannesk-core", rev = "6d7d749fca360cc2e1b8936d64be0497cfcd97e5" }  # our rust core
dannesk-xrpl-codec = { git = "https://github.com/Dannesk/dannesk-xrpl-codec", rev = "7a9243bce1905fedcac38b986e0e321c52db4c1f" }  # our XRPL transaction and address codec, under MIT
iced = { git = "https://github.com/iced-rs/iced", rev = "56be3ede2b21f4880d1a1d7154bf8fcb84a729da", features = ["tokio", "wgpu", "svg", "canvas", "advanced"] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
zeroize = { version = "1.9", features = ["derive", "serde"] }
bitcoin = "0.32.102"
bip39 = "3.0.0"
rand = "0.10.3"
base64 = "0.23.1"
dirs = "7.0.0"
qrcode = "0.14.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sha2 = "0.11.0"
libc = "0.2.190"  # the start-up trace (src/startup_trace.rs); the process hardening is the core's
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }  # already in iced, but used directly to mark a copied phrase secret (utils/clipboard.rs)

[features]
startup-trace = []

[profile.release]
strip = true         
lto = true           
codegen-units = 1     
panic = "abort"       
opt-level = "z"       


[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
