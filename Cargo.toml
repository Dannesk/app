[package]
name = "Dannesk"
version = "0.1.4"
edition = "2024"
license = "GPL-3.0-or-later"
description = "DeFi Wallet for XRPL and Bitcoin."


[workspace]
members = ["dannesk-core", "xrpl_codec", "dannesk-noise-protocol"]

[workspace.dependencies]
dannesk-core = { path = "dannesk-core" }
xrpl_codec = { path = "xrpl_codec" }
dannesk-noise-protocol = { path = "dannesk-noise-protocol" }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"  # For StreamExt and SinkExt
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive", "serde"] }
bitcoin = "0.32.102"
secp256k1 = "0.33.1"
bip39 = "3.0.0"
aes-gcm = "0.11.1"
rand = "0.10.3"
base64 = "0.23.1"
argon2 = "0.6.0"
dirs = "7.0.0"
qrcode = "0.14.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11.0"
ripemd = "0.2.0"
bs58 = { version = "0.5.1", features = ["check"] }
hex = "0.4.3"
zstd = "0.14.0"
region = "4.0.1"
libc = "0.2.190"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[dependencies]
dannesk-core = { workspace = true }  # our rust core
xrpl_codec = { workspace = true }  # our XRPL transaction and address codec, under MIT
iced = { git = "https://github.com/iced-rs/iced", rev = "56be3ede2b21f4880d1a1d7154bf8fcb84a729da", features = ["tokio", "wgpu", "svg", "canvas", "advanced"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
bitcoin = { workspace = true }
bip39 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
qrcode = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }  # the start-up trace (src/startup_trace.rs); the process hardening is the core's
arboard = { workspace = true }  # already in iced, but used directly to mark a copied phrase secret (utils/clipboard.rs)

[features]
startup-trace = []

[profile.release]
strip = true         
lto = true           
codegen-units = 1     
panic = "abort"       
opt-level = "z"       


[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
